name: Publish generated site to smk5g5.github.io
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-website
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - name: Render public output
        run: quarto render
      - name: Validate generated files
        run: python3 scripts/check-public-output.py _site
      - name: Publish generated files to public repository
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PAGES_DEPLOY_KEY" ]; then
            echo "Add the PAGES_DEPLOY_KEY repository secret before publishing. See SETUP.md."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PAGES_DEPLOY_KEY" > "$RUNNER_TEMP/pages-deploy-key"
          chmod 600 "$RUNNER_TEMP/pages-deploy-key"
          trap 'rm -f "$RUNNER_TEMP/pages-deploy-key"' EXIT
          python3 - <<'PYKEYS'
          import json, pathlib, urllib.request
          meta = json.load(urllib.request.urlopen("https://api.github.com/meta"))
          pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("".join("github.com " + key + "\n" for key in meta["ssh_keys"]))
          PYKEYS
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/pages-deploy-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:smk5g5/smk5g5.github.io.git "$RUNNER_TEMP/public-website"
          export QUARTO_PUBLIC_OUTPUT="$GITHUB_WORKSPACE/_site"
          export PUBLIC_WEBSITE_CHECKOUT="$RUNNER_TEMP/public-website"
          python3 scripts/sync-public-output.py
          cd "$RUNNER_TEMP/public-website"
          git checkout -B main
          git config user.name "$GITHUB_ACTOR"
          git config user.email "website-publisher@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Public site is already current."
          else
            git commit -m "Publish Quarto website"
            git push origin HEAD:main
          fi
