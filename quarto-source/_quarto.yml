project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
  resources:
    - assets/**
    - styles.css
website:
  title: "Saad Murtaza Khan"
  site-url: https://smk5g5.github.io
  search: false
  draft-mode: gone
format:
  html:
    theme: none
    template: _templates/page.html
    title-block-style: none
    toc: false
    anchor-sections: false
    code-copy: false
    highlight-style: github
    html-math-method: mathml
    lang: en
site-root: .
execute:
  eval: false
  echo: true
